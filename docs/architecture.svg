<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .b{fill:#f4f6fb;stroke:#4b5d8a;stroke-width:1.5}
    .m{fill:#eaf6ee;stroke:#3b8a5a;stroke-width:1.5}
    .d{fill:#fff4e0;stroke:#b8812b;stroke-width:1.5}
    text{fill:#1d2433}
    .s{font-size:11px;fill:#55607a}
    .a{stroke:#4b5d8a;stroke-width:1.5;fill:none;marker-end:url(#h)}
  </style>
  <defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5d8a"/></marker></defs>
  <rect class="b" x="10" y="120" width="110" height="60" rx="8"/><text x="65" y="148" text-anchor="middle">React UI</text><text class="s" x="65" y="166" text-anchor="middle">Vite :5173</text>
  <rect class="b" x="170" y="120" width="130" height="60" rx="8"/><text x="235" y="148" text-anchor="middle">Express routes</text><text class="s" x="235" y="166" text-anchor="middle">zod, :4000</text>
  <rect class="b" x="350" y="40" width="150" height="60" rx="8"/><text x="425" y="66" text-anchor="middle">ingest.service</text><text class="s" x="425" y="84" text-anchor="middle">fetch, chunk, embed</text>
  <rect class="b" x="350" y="200" width="150" height="60" rx="8"/><text x="425" y="226" text-anchor="middle">query.service</text><text class="s" x="425" y="244" text-anchor="middle">retrieve, prompt, cite</text>
  <rect class="d" x="560" y="120" width="120" height="60" rx="8"/><text x="620" y="148" text-anchor="middle">SQLite + FTS5</text><text class="s" x="620" y="166" text-anchor="middle">items, chunks, vectors</text>
  <rect class="d" x="560" y="200" width="120" height="60" rx="8"/><text x="620" y="226" text-anchor="middle">Vector index</text><text class="s" x="620" y="244" text-anchor="middle">in memory, exact</text>
  <rect class="m" x="710" y="40" width="100" height="60" rx="8"/><text x="760" y="66" text-anchor="middle">Gemini</text><text class="s" x="760" y="84" text-anchor="middle">embeddings</text>
  <rect class="m" x="710" y="200" width="100" height="60" rx="8"/><text x="760" y="226" text-anchor="middle">Gemini / NVIDIA</text><text class="s" x="760" y="244" text-anchor="middle">answers</text>
  <path class="a" d="M120 150H170"/>
  <path class="a" d="M300 135L350 80"/>
  <path class="a" d="M300 165L350 220"/>
  <path class="a" d="M500 70H560L620 120"/>
  <path class="a" d="M500 80H710"/>
  <path class="a" d="M620 180V200"/>
  <path class="a" d="M500 230H560"/>
  <path class="a" d="M500 245H710"/>
  <text class="s" x="535" y="30" text-anchor="middle">SSRF-guarded URL fetch happens inside ingest.service</text>
  <text class="s" x="410" y="305" text-anchor="middle">Save: routes → ingest → SQLite → index.   Ask: routes → query → index (+ keyword search) → model → cited answer.</text>
</svg>
